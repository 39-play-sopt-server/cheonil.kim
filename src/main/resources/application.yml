spring:
  profiles:
    default: local
  application:
    name: assignment

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/assignment}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100

server:
  forward-headers-strategy: framework   # Nginx의 X-Forwarded-Proto를 읽어 Swagger가 https URL을 생성

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}   # 쉼표로 여러 개 가능